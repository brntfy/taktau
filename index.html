<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Object &amp; Sign Speaker</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<style>
  :root{
    --bg:#0a0a0a;
    --accent:#4fd1c5;
    --accent2:#ffd23f;
    --danger:#ff5c5c;
    --text:#f2f2f2;
    --dim:rgba(255,255,255,0.55);
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "Courier New", monospace;
  }
  @media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#0a0a0a; } }
  :root[data-theme="dark"]{ --bg:#0a0a0a; }

  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg); overflow:hidden;
    font-family:var(--font); color:var(--text);
    -webkit-user-select:none; user-select:none;
  }

  #stage{ position:relative; width:100vw; height:100vh; background:#000; overflow:hidden; }

  video{
    position:absolute; inset:0; width:100%; height:100%;
    object-fit:cover; transform:scaleX(-1); display:block;
  }
  canvas#overlay{ position:absolute; inset:0; width:100%; height:100%; pointer-events:none; }

  #topbar{
    position:absolute; top:0; left:0; right:0;
    display:flex; justify-content:space-between; align-items:center;
    padding:10px 14px;
    background:linear-gradient(180deg, rgba(0,0,0,0.65), rgba(0,0,0,0));
    z-index:5; font-size:13px;
  }
  #topbar .badge{
    display:flex; align-items:center; gap:6px;
    background:rgba(255,255,255,0.08);
    padding:5px 10px; border-radius:999px;
    font-size:12px;
  }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--dim); }
  .dot.live{ background:var(--danger); box-shadow:0 0 6px var(--danger); animation:blink 1.2s steps(2,start) infinite; }
  @keyframes blink{ 50%{ opacity:0.2; } }

  #caption{
    position:absolute; left:0; right:0; bottom:110px;
    display:flex; justify-content:center; z-index:5;
    padding:0 16px;
  }
  #caption span{
    background:rgba(0,0,0,0.6);
    padding:8px 16px; border-radius:10px;
    font-size:clamp(13px,3.6vw,18px);
    text-align:center; max-width:90%;
    border:1px solid rgba(255,255,255,0.12);
  }

  #debug{
    position:absolute; left:12px; bottom:110px;
    font-family:var(--mono); font-size:10.5px;
    color:var(--dim); background:rgba(0,0,0,0.4);
    padding:8px 10px; border-radius:8px; line-height:1.5;
    z-index:5; max-width:220px;
  }

  #bottombar{
    position:absolute; left:0; right:0; bottom:0;
    display:flex; justify-content:center; gap:12px;
    padding:16px 14px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(0,0,0,0.7), rgba(0,0,0,0));
    z-index:6;
  }
  button{
    font-family:var(--font); font-weight:600; font-size:14px;
    border:none; border-radius:10px; padding:12px 20px;
    background:var(--accent); color:#00201d;
  }
  button.secondary{ background:rgba(255,255,255,0.12); color:var(--text); }
  button:disabled{ opacity:0.4; }

  #status{
    position:absolute; left:50%; top:50%; transform:translate(-50%,-50%);
    text-align:center; z-index:10; max-width:85%; line-height:1.6;
    background:rgba(0,0,0,0.55); padding:20px 22px; border-radius:14px;
    font-size:14px;
  }
  #status button{ margin-top:12px; }

  #signFlag{
    position:absolute; top:60px; right:14px; z-index:5;
    background:rgba(0,0,0,0.55); border:1px solid var(--accent2);
    color:var(--accent2); font-family:var(--mono);
    padding:6px 12px; border-radius:8px; font-size:13px;
  }
</style>
</head>
<body>
<div id="stage">
  <video id="video" autoplay playsinline muted></video>
  <canvas id="overlay"></canvas>

  <div id="topbar">
    <div class="badge"><span class="dot" id="camDot"></span><span id="camLabel">Camera off</span></div>
    <div class="badge"><span class="dot" id="modelDot"></span><span id="modelLabel">Models not loaded</span></div>
  </div>

  <div id="signFlag">SIGN: --</div>
  <div id="debug"></div>

  <div id="caption"><span id="captionText">Say hello by showing a sign, or point at an object.</span></div>

  <div id="bottombar">
    <button id="startBtn">▶ Start</button>
    <button id="stopBtn" class="secondary" disabled>■ Stop</button>
  </div>

  <div id="status">
    Object detection + ASL sign speaker.<br/>
    Tap Start to load the models and enable your camera.
  </div>
</div>

<!-- TensorFlow.js + COCO-SSD object detector (regular scripts, load before the module below) -->
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>

<script type="module">
import { HandLandmarker, FilesetResolver } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

(async function(){
  const video = document.getElementById('video');
  const canvas = document.getElementById('overlay');
  const ctx = canvas.getContext('2d');
  const statusEl = document.getElementById('status');
  const startBtn = document.getElementById('startBtn');
  const stopBtn = document.getElementById('stopBtn');
  const camDot = document.getElementById('camDot');
  const camLabel = document.getElementById('camLabel');
  const modelDot = document.getElementById('modelDot');
  const modelLabel = document.getElementById('modelLabel');
  const captionText = document.getElementById('captionText');
  const signFlag = document.getElementById('signFlag');
  const debugEl = document.getElementById('debug');

  let objectModel = null;
  let handLandmarker = null;
  let running = false;
  let lastVideoTime = -1;

  // ---------- name mapping ----------
  const SIGN_PHRASES = {
    'Y': 'Hello my name is Nur Syazarul',
    'C': 'Hello my name is Nur Aidan'
  };

  // ---------- speech queue (prevents overlapping/garbled speech) ----------
  const speechQueue = [];
  let speaking = false;
  function queueSpeak(text){
    speechQueue.push(text);
    playNext();
  }
  function playNext(){
    if (speaking || speechQueue.length === 0) return;
    speaking = true;
    const text = speechQueue.shift();
    captionText.textContent = text;
    const utter = new SpeechSynthesisUtterance(text);
    utter.rate = 1.0;
    utter.onend = () => { speaking = false; playNext(); };
    utter.onerror = () => { speaking = false; playNext(); };
    speechSynthesis.speak(utter);
  }

  // ---------- canvas sizing ----------
  function resizeCanvas(){
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  // ---------- object detection ----------
  const lastSpokenObject = new Map(); // className -> timestamp
  const OBJECT_COOLDOWN_MS = 6000;
  const OBJECT_CONFIDENCE = 0.6;
  let lastObjectDetectTime = 0;
  const OBJECT_DETECT_INTERVAL_MS = 700;
  let currentBoxes = [];

  async function runObjectDetection(now){
    if (!objectModel) return;
    if (now - lastObjectDetectTime < OBJECT_DETECT_INTERVAL_MS) return;
    lastObjectDetectTime = now;
    try{
      const predictions = await objectModel.detect(video);
      currentBoxes = predictions.filter(p => p.score >= OBJECT_CONFIDENCE);

      currentBoxes.forEach(p => {
        const last = lastSpokenObject.get(p.class) || 0;
        if (now - last > OBJECT_COOLDOWN_MS){
          lastSpokenObject.set(p.class, now);
          queueSpeak(capitalize(p.class));
        }
      });
    } catch(e){ console.error('object detect failed', e); }
  }

  function capitalize(s){ return s.charAt(0).toUpperCase() + s.slice(1); }

  function drawObjectBoxes(){
    const scaleX = canvas.width / video.videoWidth;
    const scaleY = canvas.height / video.videoHeight;
    currentBoxes.forEach(p => {
      const [x,y,w,h] = p.bbox;
      // mirror horizontally to match the mirrored video display
      const drawX = canvas.width - (x + w) * scaleX;
      const drawY = y * scaleY;
      const drawW = w * scaleX;
      const drawH = h * scaleY;

      ctx.strokeStyle = '#4fd1c5';
      ctx.lineWidth = 2;
      ctx.strokeRect(drawX, drawY, drawW, drawH);

      const label = `${p.class} ${(p.score*100).toFixed(0)}%`;
      ctx.font = '13px -apple-system, sans-serif';
      const textW = ctx.measureText(label).width;
      ctx.fillStyle = 'rgba(79,209,197,0.9)';
      ctx.fillRect(drawX, drawY - 20, textW + 10, 20);
      ctx.fillStyle = '#00201d';
      ctx.fillText(label, drawX + 5, drawY - 5);
    });
  }

  // ---------- hand sign detection ----------
  function mirrorX(xNorm){ return 1 - xNorm; }
  function toPixel(lm){ return { x: mirrorX(lm.x) * canvas.width, y: lm.y * canvas.height }; }

  function angleDeg(a,b,c){
    const v1x=a.x-b.x, v1y=a.y-b.y;
    const v2x=c.x-b.x, v2y=c.y-b.y;
    const dot=v1x*v2x+v1y*v2y;
    const m1=Math.hypot(v1x,v1y), m2=Math.hypot(v2x,v2y);
    const cos=Math.max(-1,Math.min(1, dot/(m1*m2+1e-6)));
    return Math.acos(cos)*180/Math.PI;
  }
  function curlOf(lms, mcpI, pipI, tipI){
    const angle = angleDeg(lms[mcpI], lms[pipI], lms[tipI]);
    return Math.max(0, Math.min(1, 1 - angle/180));
  }

  function drawSkeleton(lms){
    const pts = lms.map(toPixel);
    const chains = [[0,1,2,3,4],[0,5,6,7,8],[0,9,10,11,12],[0,13,14,15,16],[0,17,18,19,20],[5,9,13,17]];
    chains.forEach(chain=>{
      for(let i=0;i<chain.length-1;i++){
        ctx.beginPath();
        ctx.moveTo(pts[chain[i]].x, pts[chain[i]].y);
        ctx.lineTo(pts[chain[i+1]].x, pts[chain[i+1]].y);
        ctx.strokeStyle='rgba(255,210,63,0.55)';
        ctx.lineWidth=1.5;
        ctx.stroke();
      }
    });
    pts.forEach((p,i)=>{
      ctx.beginPath();
      ctx.arc(p.x,p.y,[4,8,12,16,20].includes(i)?5:2.5,0,Math.PI*2);
      ctx.fillStyle = [4,8,12,16,20].includes(i) ? '#ffd23f' : 'rgba(255,255,255,0.6)';
      ctx.fill();
    });
  }

  function handSize(lms){
    const wrist = lms[0], midMcp = lms[9];
    return Math.hypot(wrist.x-midMcp.x, wrist.y-midMcp.y) + 1e-6;
  }

  function classifySign(lms){
    const idx = curlOf(lms,5,6,8);
    const mid = curlOf(lms,9,10,12);
    const rng = curlOf(lms,13,14,16);
    const pnk = curlOf(lms,17,18,20);
    const thb = curlOf(lms,1,2,4);

    const scale = handSize(lms);
    const gap = Math.hypot(lms[4].x-lms[8].x, lms[4].y-lms[8].y) / scale;

    debugEl.textContent =
      `IDX ${idx.toFixed(2)}  MID ${mid.toFixed(2)}\n` +
      `RNG ${rng.toFixed(2)}  PNK ${pnk.toFixed(2)}\n` +
      `THB ${thb.toFixed(2)}  GAP ${gap.toFixed(2)}`;

    // Y: thumb + pinky extended, index/middle/ring curled
    const isY = thb < 0.35 && pnk < 0.35 && idx > 0.55 && mid > 0.55 && rng > 0.55;

    // C: all fingers partially curled (forming a C-curve), moderate thumb-index gap
    const partial = v => v > 0.20 && v < 0.68;
    const isC = partial(idx) && partial(mid) && partial(rng) && partial(pnk) &&
                thb > 0.10 && thb < 0.68 && gap > 0.35 && gap < 1.3;

    if (isY) return 'Y';
    if (isC) return 'C';
    return null;
  }

  let stableSign = null;
  let stableCount = 0;
  const STABILITY_FRAMES = 8;
  let lastSpokenSign = null;
  let signCooldownUntil = 0;
  const SIGN_COOLDOWN_MS = 4000;

  function handleSign(sign, now){
    signFlag.textContent = 'SIGN: ' + (sign || '--');

    if (sign === stableSign){
      stableCount++;
    } else {
      stableSign = sign;
      stableCount = 1;
    }

    if (sign && stableCount >= STABILITY_FRAMES && now > signCooldownUntil){
      if (sign !== lastSpokenSign || now > signCooldownUntil){
        lastSpokenSign = sign;
        signCooldownUntil = now + SIGN_COOLDOWN_MS;
        queueSpeak(SIGN_PHRASES[sign]);
      }
    }
    if (!sign){
      lastSpokenSign = null;
    }
  }

  // ---------- main loop ----------
  async function predictLoop(){
    if (!running) return;
    const now = performance.now();

    if (video.readyState >= 2 && video.currentTime !== lastVideoTime){
      lastVideoTime = video.currentTime;

      ctx.clearRect(0,0,canvas.width,canvas.height);

      // hands
      try{
        const handResult = handLandmarker.detectForVideo(video, now);
        const hands = handResult.landmarks || [];
        if (hands.length){
          hands.forEach(lms => drawSkeleton(lms));
          const sign = classifySign(hands[0]);
          handleSign(sign, now);
        } else {
          handleSign(null, now);
        }
      } catch(e){ /* non-fatal per-frame errors */ }

      // objects (throttled internally)
      await runObjectDetection(now);
      drawObjectBoxes();
    }

    requestAnimationFrame(predictLoop);
  }

  async function start(){
    startBtn.disabled = true;
    statusEl.style.display = 'block';
    statusEl.innerHTML = 'Loading object detection model…';
    try{
      objectModel = await cocoSsd.load();
      modelLabel.textContent = 'Object model ready';

      statusEl.innerHTML = 'Loading hand tracking model…';
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
      );
      try{
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });
      } catch(gpuErr){
        handLandmarker = await HandLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
            delegate: "CPU"
          },
          runningMode: "VIDEO",
          numHands: 1
        });
      }
      modelDot.classList.add('live');
      modelLabel.textContent = 'Models ready';

      statusEl.innerHTML = 'Requesting camera access…';
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: "environment", width:{ideal:1280}, height:{ideal:720} },
        audio: false
      });
      video.srcObject = stream;
      await new Promise(res => { video.onloadedmetadata = () => { video.play(); res(); }; });

      camDot.classList.add('live');
      camLabel.textContent = 'Camera live';
      statusEl.style.display = 'none';
      stopBtn.disabled = false;

      running = true;
      requestAnimationFrame(predictLoop);

    } catch(err){
      console.error(err);
      statusEl.innerHTML = 'Could not start.<br/>' +
        (err && err.message ? err.message : 'Permission denied or unsupported browser.') +
        '<br/><button id="retryBtn">↻ Retry</button>';
      startBtn.disabled = false;
      const retryBtn = document.getElementById('retryBtn');
      if (retryBtn) retryBtn.addEventListener('click', start);
    }
  }

  function stop(){
    running = false;
    stopBtn.disabled = true;
    startBtn.disabled = false;
    camDot.classList.remove('live');
    camLabel.textContent = 'Camera off';
    const stream = video.srcObject;
    if (stream){ stream.getTracks().forEach(t => t.stop()); }
    video.srcObject = null;
    ctx.clearRect(0,0,canvas.width,canvas.height);
    speechSynthesis.cancel();
    speechQueue.length = 0;
    speaking = false;
  }

  startBtn.addEventListener('click', start);
  stopBtn.addEventListener('click', stop);
})();
</script>
</body>
</html>
